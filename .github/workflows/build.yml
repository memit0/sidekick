name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: cd build && ditto -c -k --keepParent Sidekick.app Sidekick.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sidekick
          path: build/Sidekick.zip
